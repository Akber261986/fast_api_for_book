# OpenAPI Contract: Search API

## Overview
This document defines the OpenAPI specification for the semantic search functionality of the book search application.

## Search Endpoints

### POST /api/v1/search/query
**Description**: Perform semantic search on book content using natural language queries.

**Request**:
```json
{
  "query_text": "What are the key principles of semantic search?",
  "top_k": 5,
  "similarity_threshold": 0.7,
  "filters": {
    "source_file": "principles.md"
  }
}
```

**Request Schema**:
```yaml
type: object
properties:
  query_text:
    type: string
    description: "Natural language query to search for"
    minLength: 1
    maxLength: 500
  top_k:
    type: integer
    description: "Number of results to return"
    minimum: 1
    maximum: 20
    default: 5
  similarity_threshold:
    type: number
    description: "Minimum similarity score for results"
    minimum: 0.0
    maximum: 1.0
    default: 0.7
  filters:
    type: object
    description: "Optional metadata filters"
    additionalProperties: true
required:
  - query_text
```

**Response (200 OK)**:
```json
{
  "query": "What are the key principles of semantic search?",
  "results": [
    {
      "content": {
        "id": "chunk-123",
        "text": "Semantic search relies on understanding the meaning and context of search queries...",
        "source_file": "principles.md",
        "section": "Introduction",
        "title": "Semantic Search Principles"
      },
      "similarity_score": 0.89,
      "rank": 1
    }
  ],
  "total_results": 1
}
```

**Response Schema**:
```yaml
type: object
properties:
  query:
    type: string
    description: "The original query text"
  results:
    type: array
    items:
      type: object
      properties:
        content:
          type: object
          properties:
            id:
              type: string
              description: "Unique identifier for the content chunk"
            text:
              type: string
              description: "The matching content text"
            source_file:
              type: string
              description: "Original source file"
            section:
              type: string
              description: "Section identifier"
            title:
              type: string
              description: "Title of the content"
        similarity_score:
          type: number
          description: "Similarity score between 0.0 and 1.0"
          minimum: 0.0
          maximum: 1.0
        rank:
          type: integer
          description: "Position in the result list"
      required:
        - content
        - similarity_score
        - rank
  total_results:
    type: integer
    description: "Total number of results found"
required:
  - query
  - results
  - total_results
```

**Error Responses**:
- 400: Bad Request (invalid query parameters)
- 422: Unprocessable Entity (validation errors)
- 500: Internal Server Error (system errors)

## Embedding Endpoints

### POST /api/v1/embeddings/process
**Description**: Process markdown files and store embeddings in Qdrant.

**Request**:
```json
{
  "source_files": ["book1.md", "book2.md"],
  "rebuild_collection": false
}
```

**Request Schema**:
```yaml
type: object
properties:
  source_files:
    type: array
    items:
      type: string
      description: "Path to markdown file to process"
  rebuild_collection:
    type: boolean
    description: "Whether to clear existing collection before processing"
    default: false
required:
  - source_files
```

**Response (202 Accepted)**:
```json
{
  "job_id": "job-12345",
  "status": "processing",
  "total_files": 2,
  "message": "Embedding job started successfully"
}
```

## Agent Endpoints

### POST /api/v1/agents/query
**Description**: Process query using OpenAI Agent with book content context.

**Request**:
```json
{
  "query": "Explain the concept of vector embeddings in simple terms",
  "context_window": 5
}
```

**Response (200 OK)**:
```json
{
  "response": "Vector embeddings are numerical representations of text that capture semantic meaning...",
  "sources": [
    {
      "content_id": "chunk-456",
      "text": "A vector embedding is a numerical representation of text...",
      "source_file": "embeddings.md",
      "similarity_score": 0.92
    }
  ]
}
```