[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools"

[project]
name = "fastapi-book-search"
version = "0.1.0"
description = "A FastAPI application for semantic search of book content using Qdrant and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "qdrant-client>=1.8.0",
    "google-generativeai>=0.4.0",
    "openai>=1.3.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "pytest>=7.4.3",
    "httpx>=0.25.2",
    "pytest-asyncio>=0.21.1",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.8",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.10.1",
    "isort==5.12.0",
]

[tool.setuptools]
py-modules = []